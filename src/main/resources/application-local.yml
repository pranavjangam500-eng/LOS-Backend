    driver-class-name: org.h2.Driver
    default-url-prefix: "jdbc:h2:mem:"
    default-url-suffix: ";DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE"
    username: sa
    password: ""

